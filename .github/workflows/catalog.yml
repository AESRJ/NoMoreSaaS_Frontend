name: catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: pnpm

      - name: Instalar dependencias (lockfile congelado)
        run: pnpm install --frozen-lockfile

      # Sin .specify/feature.json (ignorado) usa la referencia versionada de la entrega actual.
      - name: Verificador de la entrega
        run: python3 tools/check_handoff.py

      - name: Lint
        run: pnpm lint

      - name: Pruebas unitarias, UI y API
        run: pnpm test

      - name: Build de la SPA
        run: pnpm build

      - name: Instalar Chromium de Playwright
        run: pnpm exec playwright install --with-deps chromium

      # DB SQLite y secreto temporales propios de la ejecucion (tests/e2e/api-test-env.js).
      - name: Pruebas e2e con API, DB temporal y web reales
        run: pnpm test:e2e
